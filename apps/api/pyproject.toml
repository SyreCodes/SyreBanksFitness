[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syre-banks-fitness-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3",
  "pydantic[email]>=2.9,<3", "argon2-cffi>=23.1", "PyJWT>=2.9,<3",
  "redis>=5,<7", "celery>=5.4,<6", "httpx>=0.27,<1", "python-dateutil>=2.9,<3", "python-multipart>=0.0.18",
  "boto3>=1.35,<2", "azure-identity>=1.19,<2", "azure-storage-blob>=12.23,<13",
  "reportlab>=4.2,<5", "Pillow>=11.3,<13"
]
[project.optional-dependencies]
dev = ["aiohttp>=3.12,<4", "pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-redis", "pypdf>=5,<7"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf", "assets/fonts/LICENSE.txt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*", "dateutil.*", "reportlab.*"]
ignore_missing_imports = true
