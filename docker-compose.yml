services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env using scripts/configure_local.py}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fitness-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Generate .env using scripts/configure_local.py}
    ports: ["127.0.0.1:9001:9001"]
    volumes: ["storage_data:/data"]
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fitness:${POSTGRES_PASSWORD}@postgres:5432/fitness
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/private-media
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["private_media:/app/private-media"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fitness:${POSTGRES_PASSWORD}@postgres:5432/fitness
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/private-media
    command: ["celery", "-A", "app.core.jobs.celery_app", "worker", "--loglevel=info"]
    volumes: ["private_media:/app/private-media"]
    depends_on:
      api: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_API_URL: /api/v1
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
  storage_data:
  private_media:
