name: Quality gates
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: fitness, POSTGRES_USER: fitness, POSTGRES_PASSWORD: ci-test-only }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fitness" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://fitness:ci-test-only@localhost:5432/fitness
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-test-secret-not-used-in-any-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e 'apps/api[dev]'
      - run: ruff check apps/api
      - run: mypy app
        working-directory: apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest
        working-directory: apps/api
