name: Release to Azure

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ${{ fromJSON(vars.AZURE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    environment: production
    timeout-minutes: 90
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}
      AZURE_WORKER_APP: ${{ vars.AZURE_WORKER_APP }}
      AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
      AZURE_SCHEDULER_JOB: ${{ vars.AZURE_SCHEDULER_JOB }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      IMAGE_REPOSITORY: ${{ vars.AZURE_IMAGE_REPOSITORY || 'syrebanks-fitness' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse a superseded commit
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; this older release will not deploy.'
            exit 1
          fi
      - name: Authenticate with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve registry and authenticate Docker
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_ACR_NAME:?Set AZURE_ACR_NAME}"
          server=$(az acr show --name "$AZURE_ACR_NAME" --query loginServer --output tsv)
          test -n "$server"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          az acr login --name "$AZURE_ACR_NAME" --only-show-errors
      - name: Download the image that passed CI
        uses: actions/download-artifact@v4
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/tested-image
      - name: Push the tested image and resolve its digest
        id: image
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.server }}
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/tested-image/production-image.tar.gz" | docker load
          target="$REGISTRY_SERVER/$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker tag syre-banks-fitness:ci "$target"
          docker push "$target"
          digest=$(az acr repository show --name "$AZURE_ACR_NAME" \
            --image "$IMAGE_REPOSITORY:$GITHUB_SHA" --query digest --output tsv)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Migrate, verify and release immutable image
        env:
          IMAGE: ${{ steps.registry.outputs.server }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: |
          python scripts/azure/release.py \
            --image "$IMAGE" \
            --release-id "r-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
